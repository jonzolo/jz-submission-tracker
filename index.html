<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JZ Submission Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f8fa; --surface2: #eef1f5; --border: #d0d7de;
    --text: #1f2328; --text-dim: #656d76; --accent: #0969da; --green: #1a7f37;
    --yellow: #9a6700; --red: #cf222e; --orange: #bc4c00; --purple: #8250df; --pink: #bf3989;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header h1 span { color: var(--text-dim); font-weight: 400; font-size: 14px; }
  .last-updated { font-size: 13px; color: var(--text-dim); background: var(--surface); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); }
  .last-updated .pulse { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .stats { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; min-width: 120px; text-align: center; }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.hot .num { color: var(--orange); }
  .stat.won .num { color: var(--green); }
  .stat.lost .num { color: var(--red); }
  .stat.total .num { color: var(--accent); }
  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filters label { font-size: 13px; color: var(--text-dim); margin-right: 4px; }
  .filter-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .search-box { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 14px; border-radius: 6px; font-size: 13px; width: 200px; margin-left: auto; }
  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: var(--surface); position: sticky; top: 0; z-index: 1; }
  th { text-align: left; padding: 10px 14px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--text); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: rgba(9,105,218,0.03); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; cursor: pointer; transition: box-shadow 0.15s; }
  .badge:hover { box-shadow: 0 0 0 2px rgba(9,105,218,0.3); }
  .badge-submitted { background: #fbefff; color: #8250df; }
  .badge-active { background: #fff8c5; color: #9a6700; }
  .badge-chemistry { background: #ffeff7; color: #bf3989; }
  .badge-won { background: #dafbe1; color: #1a7f37; }
  .badge-lost { background: #ffebe9; color: #cf222e; }
  .badge-declined { background: #f6f8fa; color: #656d76; }
  .badge-passed { background: #f6f8fa; color: #656d76; }
  .dsub-yes { color: var(--red); font-weight: 600; }
  .dsub-potential { color: var(--yellow); }
  .dsub-no { color: var(--text-dim); }
  .company-tag { font-size: 14px; color: var(--text); font-weight: 600; white-space: nowrap; }
  .notes-cell { max-width: 320px; font-size: 13px; color: var(--text-dim); line-height: 1.4; }
  .brand-name { font-weight: 600; }
  .date-cell { white-space: nowrap; color: var(--text-dim); font-size: 13px; }
  .status-dropdown-wrap { position: relative; display: inline-block; }
  .status-dropdown { position: absolute; top: 100%; left: 0; z-index: 100; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 4px 0; min-width: 200px; margin-top: 4px; display: none; }
  .status-dropdown.open { display: block; }
  .status-option { display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text); transition: background 0.1s; }
  .status-option:hover { background: var(--surface); }
  .status-option .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-option.current { background: var(--surface2); font-weight: 600; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 16px; }
  .loading .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <h1>JZ Submission Tracker <span>Small Gain Theorem LLC</span></h1>
  <div class="last-updated"><span class="pulse"></span> Last updated: <span id="updateTime">loading...</span></div>
</div>
<div class="stats" id="statsBar"></div>
<div class="filters">
  <label>Filter:</label>
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="hot">Hot (Active+)</button>
  <button class="filter-btn" data-filter="won">Won</button>
  <button class="filter-btn" data-filter="lost">Lost / Declined</button>
  <input type="text" class="search-box" id="searchBox" placeholder="Search brand, company...">
</div>
<div class="table-wrap">
  <table>
    <thead><tr>
      <th data-sort="brand">Brand</th><th data-sort="company">Company</th><th data-sort="rep">Rep</th>
      <th data-sort="status">Status</th><th data-sort="date_received">Received</th><th data-sort="shoot_dates">Shoot</th>
      <th data-sort="budget">Budget</th><th data-sort="dsub">D-Sub</th><th>Notes</th>
    </tr></thead>
    <tbody id="tableBody"><tr><td colspan="9"><div class="loading"><div class="spinner"></div>Loading submissions...</div></td></tr></tbody>
  </table>
</div>
<div class="toast" id="toast">Status updated</div>
<script>
const SUPABASE_URL='https://gprrncvcumlmntskilxf.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwcnJuY3ZjdW1sbW50c2tpbHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0ODIxNDYsImV4cCI6MjA5MTA1ODE0Nn0.xujYVxSG3p98odbm0NmflE6Yedoa6TTNywlUnOd0jGs';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const ALL_STATUSES=[
  {value:'SUBMITTED',label:'Submitted',color:'#8250df'},
  {value:'PITCHING',label:'Pitching',color:'#9a6700'},
  {value:'CHEMISTRY CALL',label:'Chemistry Call',color:'#bf3989'},
  {value:'WON',label:'Won',color:'#1a7f37'},
  {value:'LOST',label:'Lost',color:'#cf222e'},
  {value:'PASSED',label:'Passed',color:'#656d76'},
  {value:'DECLINED',label:'Declined',color:'#656d76'}
];
let submissions=[],currentFilter='all',currentSearch='',sortCol='date_received',sortDir=-1,openDropdownId=null,lastLocalUpdate=0;
async function init(){
  await loadData();bindEvents();
  document.addEventListener('click',e=>{if(!e.target.closest('.status-dropdown-wrap'))closeDropdown();});
  sb.channel('submissions-changes').on('postgres_changes',{event:'*',schema:'public',table:'submissions'},payload=>{
    if(Date.now()-lastLocalUpdate<3000)return;loadData();
  }).subscribe();
}
async function loadData(){
  const{data,error}=await sb.from('submissions').select('*').order('date_received',{ascending:false});
  if(error){console.error('Error:',error);document.getElementById('tableBody').innerHTML='<tr><td colspan="9" style="text-align:center;padding:40px;color:#cf222e;">Error loading data.</td></tr>';return;}
  submissions=data||[];document.getElementById('updateTime').textContent=new Date().toLocaleString();renderStats();renderTable();
}
function getBadgeClass(status){
  const s=(status||'').toUpperCase();
  if(s==='SUBMITTED')return'badge-submitted';if(s==='PITCHING')return'badge-active';
  if(s.includes('CHEMISTRY'))return'badge-chemistry';if(s==='WON')return'badge-won';
  if(s==='LOST')return'badge-lost';if(s==='DECLINED')return'badge-declined';
  if(s==='PASSED')return'badge-passed';return'badge-submitted';
}
function isHot(s){return['SUBMITTED','PITCHING','CHEMISTRY CALL'].includes((s||'').toUpperCase());}
function isWon(s){return(s||'').toUpperCase()==='WON';}
function isLost(s){const u=(s||'').toUpperCase();return u==='LOST'||u==='DECLINED'||u==='PASSED';}
function renderStats(){
  const hot=submissions.filter(s=>isHot(s.status)).length;
  const won=submissions.filter(s=>isWon(s.status)).length;
  const lost=submissions.filter(s=>isLost(s.status)).length;
  document.getElementById('statsBar').innerHTML=
    '<div class="stat total"><div class="num">'+submissions.length+'</div><div class="label">Total</div></div>'+
    '<div class="stat hot"><div class="num">'+hot+'</div><div class="label">Active Pipeline</div></div>'+
    '<div class="stat won"><div class="num">'+won+'</div><div class="label">Won</div></div>'+
    '<div class="stat lost"><div class="num">'+lost+'</div><div class="label">Lost / Declined</div></div>';
}
function filterSubs(){
  let subs=[...submissions];
  if(currentFilter==='hot')subs=subs.filter(s=>isHot(s.status));
  else if(currentFilter==='won')subs=subs.filter(s=>isWon(s.status));
  else if(currentFilter==='lost')subs=subs.filter(s=>isLost(s.status));
  if(currentSearch){const q=currentSearch.toLowerCase();subs=subs.filter(s=>(s.brand||'').toLowerCase().includes(q)||(s.company||'').toLowerCase().includes(q)||(s.rep||'').toLowerCase().includes(q)||(s.notes||'').toLowerCase().includes(q));}
  subs.sort((a,b)=>{let va=a[sortCol]||'',vb=b[sortCol]||'';if(sortCol==='date_received'){va=va||'0000-00-00';vb=vb||'0000-00-00';}if(va<vb)return-1*sortDir;if(va>vb)return 1*sortDir;return 0;});
  return subs;
}
function closeDropdown(){const e=document.querySelector('.status-dropdown.open');if(e)e.classList.remove('open');openDropdownId=null;}
function toggleDropdown(id,e){e.stopPropagation();if(openDropdownId===id){closeDropdown();return;}closeDropdown();const dd=document.getElementById('dd-'+id);if(dd){dd.classList.add('open');openDropdownId=id;}}
async function changeStatus(id,newStatus){
  closeDropdown();const sub=submissions.find(s=>s.id===id);if(!sub)return;
  const oldStatus=sub.status;sub.status=newStatus;lastLocalUpdate=Date.now();
  renderStats();renderTable();showToast('Saving: '+sub.brand+' \u2192 '+newStatus);
  const{data,error}=await sb.from('submissions').update({status:newStatus,updated_at:new Date().toISOString()}).eq('id',id).select();
  if(error||!data||data.length===0){console.error('Error:',error||'No rows');sub.status=oldStatus;renderStats();renderTable();showToast('Error saving \u2014 reverted');}
  else{Object.assign(sub,data[0]);renderStats();renderTable();showToast('Saved: '+sub.brand+' \u2192 '+newStatus);}
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function renderTable(){
  const subs=filterSubs();const tbody=document.getElementById('tableBody');
  if(subs.length===0){tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-dim);">No submissions match your filter.</td></tr>';return;}
  tbody.innerHTML=subs.map(s=>{
    const dc=s.dsub==='YES'?'dsub-yes':s.dsub==='POTENTIAL'?'dsub-potential':'dsub-no';
    const bc=getBadgeClass(s.status);
    const opts=ALL_STATUSES.map(o=>'<div class="status-option '+(o.value===s.status?'current':'')+'" onclick="changeStatus('+s.id+',\x27'+o.value+'\x27)"><span class="dot" style="background:'+o.color+'"></span>'+o.label+'</div>').join('');
    return'<tr><td class="brand-name">'+(s.brand||'')+'</td><td><span class="company-tag">'+(s.company||'')+'</span></td><td>'+(s.rep||'')+'</td><td><div class="status-dropdown-wrap"><span class="badge '+bc+'" onclick="toggleDropdown('+s.id+',event)">'+(s.status||'')+'</span><div class="status-dropdown" id="dd-'+s.id+'">'+opts+'</div></div></td><td class="date-cell">'+(s.date_received||'')+'</td><td class="date-cell">'+(s.shoot_dates||'--')+'</td><td>'+(s.budget||'--')+'</td><td class="'+dc+'">'+(s.dsub||'NO')+'</td><td class="notes-cell">'+(s.notes||'')+'</td></tr>';
  }).join('');
}
function bindEvents(){
  document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;renderTable();});});
  document.getElementById('searchBox').addEventListener('input',e=>{currentSearch=e.target.value;renderTable();});
  document.querySelectorAll('th[data-sort]').forEach(th=>{th.addEventListener('click',()=>{const col=th.dataset.sort;if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}renderTable();});});
}
init();
</script>
</body>
</html>
