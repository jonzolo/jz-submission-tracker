<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JZ Submission Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f8fa;
    --surface2: #eef1f5;
    --border: #d0d7de;
    --text: #1f2328;
    --text-dim: #656d76;
    --accent: #0969da;
    --green: #1a7f37;
    --yellow: #9a6700;
    --red: #cf222e;
    --orange: #bc4c00;
    --purple: #8250df;
    --pink: #bf3989;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5;
  }
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
  }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header h1 span { color: var(--text-dim); font-weight: 400; font-size: 14px; }
  .last-updated {
    font-size: 13px; color: var(--text-dim); background: var(--surface);
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
  }
  .last-updated .pulse {
    display: inline-block; width: 8px; height: 8px; background: var(--green);
    border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .stats { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 20px; min-width: 120px; text-align: center;
  }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.hot .num { color: var(--orange); }
  .stat.choose .num { color: #b45309; }
  .stat.choose { border-color: #f59e0b; background: #fffbeb; }

  /* Parallel-sub guardrail banner — shows when 2+ active rows share a brand and any isn't CHOOSE */
  .parallel-alert {
    margin: 0 0 16px 0; padding: 14px 18px;
    background: repeating-linear-gradient(45deg, #fef2f2, #fef2f2 12px, #fee2e2 12px, #fee2e2 24px);
    border: 2px solid #dc2626; border-radius: 8px;
    color: #7f1d1d; font-size: 14px; line-height: 1.5;
    display: flex; align-items: flex-start; gap: 14px;
  }
  .parallel-alert.hidden { display: none; }
  .parallel-alert .pa-icon { font-size: 22px; flex-shrink: 0; }
  .parallel-alert .pa-body { flex: 1; }
  .parallel-alert .pa-title { font-weight: 700; margin-bottom: 4px; }
  .parallel-alert .pa-group { margin: 6px 0; }
  .parallel-alert .pa-fix {
    background: #dc2626; color: white; border: none; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    margin-left: 10px;
  }
  .parallel-alert .pa-fix:hover { background: #991b1b; }
  .stat.won .num { color: var(--green); }
  .stat.lost .num { color: var(--red); }
  .stat.total .num { color: var(--accent); }

  .filters {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
  }
  .filters label { font-size: 13px; color: var(--text-dim); margin-right: 4px; }
  .filter-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--text-dim);
    padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .filter-btn[data-filter="choose"] { border-color: #f59e0b; color: #b45309; }
  .filter-btn[data-filter="choose"].active { background: #f59e0b; color: #fff; border-color: #f59e0b; }
  .search-box {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 14px; border-radius: 6px; font-size: 13px; width: 200px; margin-left: auto;
  }
  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: var(--surface); position: sticky; top: 0; z-index: 1; }
  th {
    text-align: left; padding: 10px 14px; font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim);
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--text); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: rgba(9,105,218,0.03); }
  tr.row-declined td { opacity: 0.4; }
  tr.row-declined:hover td { opacity: 0.75; }
  tr.row-choose td { background: rgba(254, 243, 199, 0.35); }
  tr.row-choose:hover td { background: rgba(254, 243, 199, 0.6); }

  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.3px; white-space: nowrap; cursor: pointer; transition: box-shadow 0.15s;
  }
  .badge:hover { box-shadow: 0 0 0 2px rgba(9,105,218,0.3); }
  .badge-new { background: #ddf4ff; color: #0969da; }
  .badge-choose {
    background: #fef3c7; color: #92400e; border: 1px solid #f59e0b;
    animation: choose-pulse 2.4s ease-in-out infinite;
  }
  @keyframes choose-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.55); }
    50% { box-shadow: 0 0 0 5px rgba(245,158,11,0); }
  }
  .badge-active { background: #fff8c5; color: #9a6700; }
  .badge-submitted { background: #cffafe; color: #0e7490; }
  .badge-chemistry { background: #ffeff7; color: #bf3989; }
  .badge-treatment { background: #fff1e5; color: #bc4c00; }
  .badge-pitching { background: #e0e7ff; color: #3730a3; }
  .badge-won { background: #dafbe1; color: #1a7f37; }
  .badge-production { background: #dafbe1; color: #116329; }
  .badge-lost { background: #ffebe9; color: #cf222e; }
  .badge-declined { background: #f6f8fa; color: #656d76; }
  .badge-archived { background: #eaeef2; color: #57606a; }
  .badge-passed { background: #f6f8fa; color: #656d76; }

  .dsub-yes { color: var(--red); font-weight: 600; }
  .dsub-potential { color: var(--yellow); }
  .dsub-no { color: var(--text-dim); }

  /* Quieter company treatment — small colored dot + plain text.
     Status pill is the loud signal; company is identifying but secondary. */
  .company-name { font-size: 13px; color: var(--text); white-space: nowrap; }
  .company-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 7px; vertical-align: -1px; flex-shrink: 0;
  }

  .notes-cell { max-width: 320px; font-size: 13px; color: var(--text-dim); line-height: 1.4; }
  .brand-name { font-weight: 600; }
  .date-cell { white-space: nowrap; color: var(--text-dim); font-size: 13px; }

  .status-dropdown-wrap { position: relative; display: inline-block; }
  .status-dropdown {
    position: absolute; top: 100%; left: 0; z-index: 100;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 4px 0;
    min-width: 220px; margin-top: 4px; display: none;
  }
  .status-dropdown.open { display: block; }
  .status-option {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px;
    cursor: pointer; font-size: 13px; color: var(--text); transition: background 0.1s;
  }
  .status-option:hover { background: var(--surface); }
  .status-option .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-option.current { background: var(--surface2); font-weight: 600; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--bg);
    padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
    opacity: 0; transform: translateY(10px); transition: all 0.3s;
    pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .loading {
    text-align: center; padding: 60px; color: var(--text-dim); font-size: 16px;
  }
  .loading .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>JZ Submission Tracker <span>Small Gain Theorem LLC</span></h1>
  <div class="last-updated"><span class="pulse"></span> Last updated: <span id="updateTime">loading...</span></div>
</div>

<div class="stats" id="statsBar"></div>

<div class="parallel-alert hidden" id="parallelAlert"></div>

<div class="filters">

<div class="toast" id="toast">Status updated</div>

<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwcnJuY3ZjdW1sbW50c2tpbHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0ODIxNDYsImV4cCI6MjA5MTA1ODE0Nn0.xujYVxSG3p98odbm0NmflE6Yedoa6TTNywlUnOd0jGs';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ALL_STATUSES = [

// ── COMPANY COLOR MAP ──
// Tinted bg + dark text in same family. Hand-picked for known reps;

const COMPANY_COLORS = {

  'Broderville':            { bg: '#fb923c', fg: '#ffffff' },  //  30° saturated orange (white text)
  'Reform School TV':       { bg: '#d6b8a0', fg: '#5c2e0a' },  //  35° sepia/brown

  'Electra Filmworks':      { bg: '#c4b5fd', fg: '#4c1d95' },  // 260° violet
  'LEFT':                   { bg: '#d8b4fe', fg: '#581c87' },  // 280° purple

  'Freshface':              { bg: '#f0abfc', fg: '#701a75' },

  // Distinctive non-hue / dark POP pills
  'Eightfold':              { bg: '#cbd5e1', fg: '#1e293b' },  // slate gray
  '8th Street':             { bg: '#374151', fg: '#f9fafb' },  // dark gray (white text — POPS)
  '8th Street Productions': { bg: '#374151', fg: '#f9fafb' },
  'A Fresh Face in Hell':   { bg: '#991b1b', fg: '#fef2f2' },  // dark red (white text — POPS)
};

const FALLBACK_PALETTE = [
  { bg: '#fca5a5', fg: '#7f1d1d' },  // red
  { bg: '#fdba74', fg: '#9a3412' },  // peach
  { bg: '#fde047', fg: '#713f12' },  // yellow
  { bg: '#bef264', fg: '#365314' },  // chartreuse
  { bg: '#22c55e', fg: '#ffffff' },  // green
  { bg: '#0d9488', fg: '#f0fdfa' },  // teal
  { bg: '#67e8f9', fg: '#155e75' },  // cyan
  { bg: '#93c5fd', fg: '#1e3a8a' },  // sky
  { bg: '#a5b4fc', fg: '#312e81' },  // indigo
  { bg: '#c4b5fd', fg: '#4c1d95' },  // violet
  { bg: '#f0abfc', fg: '#701a75' },  // fuchsia
  { bg: '#fda4af', fg: '#881337' },  // rose
  { bg: '#cbd5e1', fg: '#1e293b' },  // slate
];

function companyColor(name) {
  if (!name) return { bg: 'var(--surface2)', fg: 'var(--text-dim)' };
  if (COMPANY_COLORS[name]) return COMPANY_COLORS[name];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return FALLBACK_PALETTE[h % FALLBACK_PALETTE.length];
}

let submissions = [];
let currentFilter = 'active';
let currentSearch = '';
let sortCol = 'date_received';
let sortDir = -1;
let openDropdownId = null;

async function init() {
  await loadData();
  bindEvents();
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.status-dropdown-wrap')) closeDropdown();
  });

  // Real-time subscription
  sb
    .channel('submissions-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'submissions' }, (payload) => {
      loadData();
    })
    .subscribe();
}

async function loadData() {
  const { data, error } = await sb
    .from('submissions')
    .select('*')
    .order('date_received', { ascending: false });

  if (error) {
    console.error('Error loading data:', error);
    const msg = (error && (error.message || error.error_description || error.hint)) || JSON.stringify(error);
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="7" style="text-align:center;padding:40px;color:#cf222e;">Error loading data: ' + msg + '</td></tr>';
    return;
  }

  submissions = data || [];
  document.getElementById('updateTime').textContent = new Date().toLocaleString();
  renderStats();
  renderParallelAlert();
  renderTable();
}

function getBadgeClass(status) {
  const s = (status || '').toUpperCase();
  if (s === 'NEW') return 'badge-new';
  if (s === 'CHOOSE') return 'badge-choose';
  if (s === 'ACTIVE') return 'badge-active';
  if (s === 'SUBMITTED') return 'badge-submitted';
  if (s === 'PITCHING') return 'badge-pitching';
  if (s.includes('CHEMISTRY')) return 'badge-chemistry';
  if (s.includes('TREATMENT')) return 'badge-treatment';
  if (s === 'WON' || s === 'WON / IN PRODUCTION') return 'badge-won';
  if (s === 'IN PRODUCTION') return 'badge-production';
  if (s === 'LOST') return 'badge-lost';
  if (s === 'DECLINED') return 'badge-declined';
  if (s === 'ARCHIVED') return 'badge-archived';
  if (s === 'PASSED') return 'badge-passed';
  return 'badge-active';
}

function isChoose(s) { return (s||'').toUpperCase() === 'CHOOSE'; }
function isActive(s) {
  const u = (s||'').toUpperCase();
  return ['NEW','CHOOSE','ACTIVE','SUBMITTED','CHEMISTRY CALL','TREATMENT DELIVERED','PITCHING'].includes(u);
}

// Normalize brand for collision detection: lowercase, strip parenthetical qualifiers,
// strip fiscal-year tags (FY26/FY27), trim punctuation/whitespace.
function normalizeBrand(b) {
  return String(b || '')
    .toLowerCase()
    .replace(/\bfy\s*\d{2,4}\b/g, '')        // FY27, FY 27, FY2027
    .replace(/\([^)]*\)/g, '')               // (Parker Posey), (June 18)
    .replace(/[^a-z0-9]+/g, ' ')             // punctuation → space
    .trim();
}

// Detect brand collisions in active rows. Returns array of groups, each
// { key, brand, rows: [...] }. Only includes groups where the rule is violated
// (i.e., at least one row in the group is NOT in CHOOSE status).
function detectParallelMismatch() {
  const buckets = {};
  for (const s of submissions) {
    if (!isActive(s.status)) continue;
    const k = normalizeBrand(s.brand);
    if (!k) continue;
    (buckets[k] = buckets[k] || []).push(s);
  }
  const groups = [];
  for (const k of Object.keys(buckets)) {
    const rows = buckets[k];
    if (rows.length < 2) continue;
    const anyNotChoose = rows.some(r => !isChoose(r.status));
    if (anyNotChoose) groups.push({ key: k, brand: rows[0].brand, rows });
  }
  return groups;
}

async function flipGroupToChoose(ids) {
  const targets = submissions.filter(s => ids.includes(s.id) && !isChoose(s.status));
  if (targets.length === 0) return;
  showToast('Flipping ' + targets.length + ' rows to CHOOSE...');
  // Optimistic
  targets.forEach(t => t.status = 'CHOOSE');
  renderStats(); renderParallelAlert(); renderTable();
  const now = new Date().toISOString();
  const results = await Promise.all(targets.map(t =>
    sb.from('submissions').update({ status: 'CHOOSE', updated_at: now }).eq('id', t.id)
  ));
  const failed = results.filter(r => r.error);
  if (failed.length) {
    showToast('Error on ' + failed.length + ' rows — reloading');
    await loadData();
  } else {
    showToast('All ' + targets.length + ' rows set to CHOOSE');
  }
}

function renderParallelAlert() {
  const alertEl = document.getElementById('parallelAlert');
  if (!alertEl) return;
  const groups = detectParallelMismatch();
  if (groups.length === 0) { alertEl.classList.add('hidden'); alertEl.innerHTML = ''; return; }
  const groupHtml = groups.map(g => {
    const idList = g.rows.map(r => r.id);
    const rowLines = g.rows.map(r =>
      `<div>&nbsp;&nbsp;&nbsp;&nbsp;#${r.id} <b>${escapeHtml(r.status)}</b> &mdash; ${escapeHtml(r.company || '?')} (${escapeHtml(r.rep || '?')})</div>`
    ).join('');
    return `<div class="pa-group">
      <div><b>${escapeHtml(g.brand)}</b> &mdash; ${g.rows.length} active rows
        <button class="pa-fix" onclick="flipGroupToChoose([${idList.join(',')}])">Flip all to CHOOSE</button>
      </div>
      ${rowLines}
    </div>`;
  }).join('');
  const title = groups.length === 1
    ? 'Parallel-sub detected &mdash; not all rows are CHOOSE'
    : groups.length + ' parallel-sub conflicts &mdash; not all rows are CHOOSE';
  alertEl.classList.remove('hidden');
  alertEl.innerHTML = `
    <div class="pa-icon">&#9888;</div>
    <div class="pa-body">
      <div class="pa-title">${title}</div>
      <div>2+ active rows share the same brand. Per the parallel-sub rule, all of them must be <b>CHOOSE</b> until JZ picks one.</div>
      ${groupHtml}
    </div>`;
}
function isWon(s) { const u = (s||'').toUpperCase(); return u === 'WON' || u === 'WON / IN PRODUCTION' || u === 'IN PRODUCTION'; }
function isLost(s) { const u = (s||'').toUpperCase(); return u === 'LOST'; }
function isDeclined(s) { const u = (s||'').toUpperCase(); return u === 'DECLINED' || u === 'PASSED'; }
function isArchived(s) { const u = (s||'').toUpperCase(); return u === 'ARCHIVED'; }

function renderStats() {
  const active = submissions.filter(s => isActive(s.status)).length;
  const choose = submissions.filter(s => isChoose(s.status)).length;
  const won = submissions.filter(s => isWon(s.status)).length;
  const lost = submissions.filter(s => isLost(s.status)).length;
  const chooseCard = choose > 0
    ? `<div class="stat choose"><div class="num">${choose}</div><div class="label">Choose!</div></div>`
    : '';
  document.getElementById('statsBar').innerHTML = `
    <div class="stat total"><div class="num">${submissions.length}</div><div class="label">Total</div></div>
    <div class="stat hot"><div class="num">${active}</div><div class="label">Active Pipeline</div></div>
    ${chooseCard}
    <div class="stat won"><div class="num">${won}</div><div class="label">Won</div></div>
    <div class="stat lost"><div class="num">${lost}</div><div class="label">Lost</div></div>
  `;
}

function filterSubs() {
  let subs = [...submissions];
  if (currentFilter === 'active') subs = subs.filter(s => isActive(s.status));
  else if (currentFilter === 'choose') subs = subs.filter(s => isChoose(s.status));
  else if (currentFilter === 'won') subs = subs.filter(s => isWon(s.status));
  else if (currentFilter === 'lost') subs = subs.filter(s => isLost(s.status));
  else if (currentFilter === 'declined') subs = subs.filter(s => isDeclined(s.status));
  else if (currentFilter === 'archived') subs = subs.filter(s => isArchived(s.status));
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    subs = subs.filter(s =>
      (s.brand||'').toLowerCase().includes(q) ||
      (s.company||'').toLowerCase().includes(q) ||
      (s.rep||'').toLowerCase().includes(q) ||
      (s.notes||'').toLowerCase().includes(q)
    );
  }
  // CHOOSE rows always sort to the top of the active view so the decision is unmissable
  subs.sort((a, b) => {
    const ac = isChoose(a.status), bc = isChoose(b.status);
    if (ac && !bc) return -1;
    if (bc && !ac) return 1;
    let va = a[sortCol] || '', vb = b[sortCol] || '';
    if (sortCol === 'date_received') { va = va || '0000-00-00'; vb = vb || '0000-00-00'; }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });
  return subs;
}

function closeDropdown() {
  const existing = document.querySelector('.status-dropdown.open');
  if (existing) existing.classList.remove('open');
  openDropdownId = null;
}

function toggleDropdown(id, e) {
  e.stopPropagation();
  if (openDropdownId === id) { closeDropdown(); return; }
  closeDropdown();
  const dd = document.getElementById('dd-' + id);
  if (dd) { dd.classList.add('open'); openDropdownId = id; }
}

async function changeStatus(id, newStatus) {
  closeDropdown();
  const sub = submissions.find(s => s.id === id);
  if (!sub) return;

  const oldStatus = sub.status;
  sub.status = newStatus;
  renderStats();
  renderTable();
  showToast('Saving: ' + sub.brand + ' → ' + newStatus);

  const { error } = await sb
    .from('submissions')
    .update({ status: newStatus, updated_at: new Date().toISOString() })
    .eq('id', id);

  if (error) {
    console.error('Error updating status:', error);
    sub.status = oldStatus;
    renderStats();
    renderParallelAlert();
    renderTable();
    showToast('Error saving — reverted');
  } else {
    showToast('Saved: ' + sub.brand + ' → ' + newStatus);
    renderParallelAlert();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTable() {
  const subs = filterSubs();
  const tbody = document.getElementById('tableBody');
  if (subs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-dim);">No submissions match your filter.</td></tr>';
    return;
  }
  tbody.innerHTML = subs.map(s => {
    const dsubCls = s.dsub === 'YES' ? 'dsub-yes' : s.dsub === 'POTENTIAL' ? 'dsub-potential' : 'dsub-no';
    const badgeCls = getBadgeClass(s.status);
    const dropdownOptions = ALL_STATUSES.map(opt =>
      `<div class="status-option ${opt.value === s.status ? 'current' : ''}" onclick="changeStatus(${s.id}, '${opt.value.replace(/'/g, "\\'")}')">
        <span class="dot" style="background:${opt.color}"></span>${opt.label}
      </div>`
    ).join('');
    const statusUp = (s.status || '').toUpperCase();
    const rowCls = (statusUp === 'DECLINED' || statusUp === 'ARCHIVED')
      ? 'row-declined'
      : (statusUp === 'CHOOSE' ? 'row-choose' : '');
    const cc = companyColor(s.company);
    const companyHtml = s.company
      ? `<span class="company-name"><span class="company-dot" style="background:${cc.bg}"></span>${escapeHtml(s.company)}</span>`
      : '';
    return `<tr class="${rowCls}">
      <td class="brand-name">${escapeHtml(s.brand)}</td>
      <td>${companyHtml}</td>
      <td>${escapeHtml(s.rep)}</td>
      <td>
        <div class="status-dropdown-wrap">
          <span class="badge ${badgeCls}" onclick="toggleDropdown(${s.id}, event)">${escapeHtml(s.status)}</span>
          <div class="status-dropdown" id="dd-${s.id}">${dropdownOptions}</div>
        </div>
      </td>
      <td class="date-cell">${escapeHtml(s.date_received)}</td>
      <td class="date-cell">${s.shoot_dates ? escapeHtml(s.shoot_dates) : '—'}</td>
      <td class="notes-cell">${escapeHtml(s.notes)}</td>
    </tr>`;
  }).join('');
}

function bindEvents() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });
  });
  document.getElementById('searchBox').addEventListener('input', e => {
    currentSearch = e.target.value;
    renderTable();
  });
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      if (sortCol === col) sortDir *= -1;
      else { sortCol = col; sortDir = 1; }
      renderTable();
    });
  });
}

init();
</script>
</body>
</html>
